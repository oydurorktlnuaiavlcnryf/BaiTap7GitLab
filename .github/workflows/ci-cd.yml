name: CI/CD Pipeline - BaiTap7

on:
  # Chạy CI khi có Pull Request vào main (Bài tập thêm #2)
  pull_request:
    branches: [main]

  # Cho phép chạy thủ công từ Actions tab
  workflow_dispatch:

jobs:
  # ==================== STAGE 1: BUILD ====================
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "========================================="
          echo "  BUILDING PROJECT - BaiTap7 CI/CD Demo"
          echo "========================================="
          echo "Build started at: $(date)"
          echo "Checking project structure..."
          ls -la BaiTap7/public/
          echo "Build completed successfully!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: BaiTap7/public/
          retention-days: 1

  # ==================== STAGE 2: TEST ====================
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build  # Chỉ chạy sau khi build thành công
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run file existence tests
        run: |
          echo "========================================="
          echo "  RUNNING TESTS - BaiTap7 CI/CD Demo"
          echo "========================================="
          echo "Checking HTML file..."
          test -f BaiTap7/public/index.html && echo "✅ index.html exists" || exit 1
          echo "Checking CSS file..."
          test -f BaiTap7/public/styles.css && echo "✅ styles.css exists" || exit 1
          echo "Checking JS file..."
          test -f BaiTap7/public/js/main.js && echo "✅ main.js exists" || exit 1

      - name: Validate HTML structure
        run: |
          echo "Validating HTML structure..."
          grep -q "<html" BaiTap7/public/index.html && echo "✅ Valid HTML structure" || exit 1
          grep -q "<head>" BaiTap7/public/index.html && echo "✅ Head section found" || exit 1
          grep -q "<body>" BaiTap7/public/index.html && echo "✅ Body section found" || exit 1
          echo "All tests passed!"

  # ==================== STAGE 3: DEPLOY (MANUAL) ====================
  # Bài tập thêm #3: Deploy chỉ chạy khi bấm nút thủ công
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, test]  # Chỉ chạy sau khi build + test thành công
    # Bài tập thêm #3: environment với manual approval
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy public files
        run: |
          echo "========================================="
          echo "  DEPLOYING TO GITHUB PAGES"
          echo "========================================="
          mkdir -p _site
          cp -r BaiTap7/public/* _site/
          echo "Files to deploy:"
          find _site/ -type f

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
